taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.158.0"

# Performance optimizations
caches:
  assets:
    dir: ":cacheDir/assets"
    maxAge: "0s"
  images:
    dir: ":cacheDir/images"
    maxAge: "8760h"
  modules:
    dir: ":cacheDir/modules"
    maxAge: "8760h"

# Image processing defaults
# `imaging.quality` was deprecated in Hugo v0.163.0 in favour of per-format
# settings; the global key is slated for removal in a future release.
imaging:
  jpeg:
    quality: 85
  webp:
    quality: 85
  avif:
    quality: 85
  resampleFilter: lanczos
  anchor: smart
