baseURL: /
title: Jeongju Pak
locale: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
canonifyURLs: false
pagination:
  pagerSize: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: "&rsquo;"
        disable: false
        ellipsis: "&hellip;"
        emDash: "&mdash;"
        enDash: "&ndash;"
        leftAngleQuote: "&laquo;"
        leftDoubleQuote: "&ldquo;"
        leftSingleQuote: "&lsquo;"
        rightAngleQuote: "&raquo;"
        rightDoubleQuote: "&rdquo;"
        rightSingleQuote: "&rsquo;"
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Jeongju Pak
  authorimage: ./assets/images/pages/author.webp
  og_image: "images/pages/portrait.png"
  moto: "Department of Computer Science & Artificial Intelligence"
  description: "I enjoy understanding how computers work, from the logic of digital circuits to the reasoning behind algorithms. Studying C and C++ and participating in an algorithms club give me opportunities to turn theory into code, test ideas, and understand why a solution works. I am exploring potential research directions in computer architecture, systems software, and efficient algorithms. My experience with local AI models and GPUs has also sparked questions about how hardware and software can work together to make better use of computing resources. I am keeping my research direction open as I continue to learn and experiment."
  disable_theme_toggle: false
  newsletter_signup: false

  p1:
    heading: "Career"
    entries:
      - date: "2026-03"
        title: "Enrolled at Jeonbuk National University (Computer Science and Artificial Intelligence)"
      - date: "2026-03"
        title: "Started participating in the ALPS algorithm club at Jeonbuk National University"
      - date: "2026-10"
        title: "Participated in the ICPC preliminary round"
  p2:
    heading: "Jeonbuk National University"
    image: "images/pages/jbnu-main-gate.jpg"
    content:
      - text: "I study Computer Science and Artificial Intelligence at Jeonbuk National University."
    image_source_name: "Jeonbuk National University, Department of Electrical Engineering"
    image_source_url: "https://wz3.jbnu.ac.kr/eeeng/index..do"

  social_media:
    github:
      enabled: true
      url: "https://github.com/jjert9070"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: career
      name: Career
      url: /#career
      weight: 20
    - identifier: study
      pre: dropdown
      name: Study
      weight: 30
    - identifier: github
      name: GitHub
      url: https://github.com/jjert9070
      weight: 40
  study:
    - identifier: algorithm
      name: Algorithm
      pageRef: /study/algorithm
      weight: 10
    - identifier: data-structure
      name: Data Structure
      pageRef: /study/data-structure
      weight: 20
    - identifier: data-structure-in-c
      name: Data Structure in C
      pageRef: /study/data-structure-in-c
      weight: 30
    - identifier: certificate
      name: Certificate
      pageRef: /study/certificate
      weight: 40
  footer:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: career
      name: Career
      url: /#career
      weight: 20
    - identifier: study
      name: Data Structure in C
      pageRef: /study/data-structure-in-c
      weight: 30
    - identifier: certificate
      name: Certificate
      pageRef: /study/certificate
      weight: 40

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.158.0"

# Performance optimizations
caches:
  assets:
    dir: ":cacheDir/assets"
    maxAge: "0s"
  images:
    dir: ":cacheDir/images"
    maxAge: "8760h"
  modules:
    dir: ":cacheDir/modules"
    maxAge: "8760h"

# Image processing defaults
# `imaging.quality` was deprecated in Hugo v0.163.0 in favour of per-format
# settings; the global key is slated for removal in a future release.
imaging:
  jpeg:
    quality: 85
  webp:
    quality: 85
  avif:
    quality: 85
  resampleFilter: lanczos
  anchor: smart
