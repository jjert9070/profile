baseURL: 'https://tailbliss.netlify.app/'
title: Jeongju Pak
locale: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
canonifyURLs: false
pagination:
  pagerSize: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Jeongju Pak
  authorimage: ./assets/images/pages/author.webp
  og_image: /images/tailbliss-cover.png
  moto: "Department of Computer Science & Aritificial Intelligence"
  description: "I enjoy understanding how computers work, from the logic of digital circuits to the reasoning behind algorithms. Studying C and C++ and participating in an algorithms club give me opportunities to turn theory into code, test ideas, and understand why a solution works. I am exploring potential research directions in computer architecture, systems software, and efficient algorithms. My experience with local AI models and GPUs has also sparked questions about how hardware and software can work together to make better use of computing resources. I am keeping my research direction open as I continue to learn and experiment."
  disable_theme_toggle: false
  newsletter_signup: true

  p1:
    heading: "Career"
    entries:
      - date: "2026-03"
        title: "Enrolled at Jeonbuk National University (Computer Science and Artificial Intelligence)"
      - date: "2026-03"
        title: "Started participating in the ALPS algorithm club at Jeonbuk National University"
      - date: "2026-10"
        title: "Participated in the ICPC preliminary round"
  p2:
    heading: "Just in time for Hacktoberfest with JIT Tailwind."
    image: "images/pages/hacktoberfest.jpg"
    content:
      - text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur at purus non enim commodo tincidunt vel in nulla. Aenean pretium dolor non ultricies bibendum. Etiam quis blandit enim. Nunc condimentum ut lorem in faucibus. Phasellus varius ligula et commodo tristique. Nunc sodales nisl nec laoreet vehicula. Donec velit nibh, sollicitudin at nulla a, egestas dignissim eros. Sed lacinia hendrerit interdum. Vestibulum pellentesque sem venenatis nisl tempor accumsan sit amet tempus felis. Mauris leo diam, porttitor nec bibendum id, tempus ac nulla. Etiam congue ornare erat at convallis. Donec in nisi dapibus, mattis risus vel, imperdiet enim. Donec fermentum sit amet tortor nec tincidunt. Nam nec lectus tortor. Nunc sit amet laoreet orci, porta ornare massa. Phasellus eget lorem mi. Nam eleifend ultricies sapien, quis mollis leo bibendum at. Quisque viverra lorem sit amet magna aliquet, et dignissim arcu eleifend."
      - type: "table"
        columns:
          - heading: "Column 1"
            items:
              - "Bullet point 1"
              - "Bullet point 2"
              - "Bullet point 3"
          - heading: "Column 2"
            items:
              - "Bullet point 4"
              - "Bullet point 5"
              - "Bullet point 6"
  p3:
    heading: "Backed by world-renowned investors"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque. Blandit amet, sed aenean erat arcu morbi. Cursus faucibus nunc nisl netus morbi vel porttitor vitae ut. Amet vitae fames senectus vitae."
    links:
      - text: Meet our investors and advisors
        url: "#"
    logos:
      - identifier: a
        image: "images/global/sample-logo.svg"
        alt: "a"
